<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>fishy 滚动/重渲染测试</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", sans-serif; }
  .feeds { column-count: 4; column-gap: 16px; padding: 16px; }
  .note-item { break-inside: avoid; margin-bottom: 16px; }
  .note-item .cover img { display: block; width: 100%; height: auto; }
  .note-item .title { display: block; font-size: 14px; }
  .note-item .author { display: flex; gap: 6px; font-size: 12px; }
  .note-item .avatar { width: 20px; height: 20px; border-radius: 50%; }
  .topbar{padding:12px 20px}
  .searchwrap{width:600px;height:44px;border:1px solid #ddd;border-radius:22px;display:flex;align-items:center;padding:0 16px;margin:0 auto}
  .searchwrap input{border:0;outline:0;width:100%;font-size:14px}
  .airow{display:flex;gap:10px;justify-content:center;margin:10px 0}
  .ai{padding:4px 10px;border:1px solid #eee;border-radius:12px;font-size:12px}
  .cats{display:flex;gap:12px;justify-content:center;font-size:13px}
  #fz-test { position: fixed; left: 0; top: 0; z-index: 2147483647; background: #111; color: #0f0; font: 12px/1.5 monospace; padding: 8px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="searchwrap"><input id="site-search" placeholder="我在小红书搞装修"><span class="dot"></span></div>
  <div class="airow"><span class="ai">做旅游攻略</span><span class="ai">答疑解惑</span></div>
  <div class="cats" id="site-cats">
    <a href="/explore?channel_id=homefeed_recommend">推荐</a>
    <a href="/explore?channel_id=homefeed.fashion_v3">穿搭</a>
    <a href="/explore?channel_id=homefeed.food_v3">美食</a>
    <a href="/explore?channel_id=homefeed.cosmetics_v3">彩妆</a>
    <a href="/explore?channel_id=homefeed.movie_and_tv_v3">影视</a>
    <a href="/explore?channel_id=homefeed.career_v3">职场</a>
  </div>
</div>
<div class="feeds" id="feeds"></div>
<pre id="fz-test">running…</pre>

<script>
var NOTES = [];
for (var i = 0; i < 14; i++) NOTES.push(['测试笔记标题 ' + (i + 1), '作者' + (i + 1), String(100 + i)]);

function paint(w, h, i, a, b) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var x = c.getContext('2d');
  var g = x.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, a); g.addColorStop(1, b);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = 'rgba(255,255,255,.8)';
  x.font = '600 24px sans-serif';
  x.fillText('IMG ' + (i + 1), 12, h - 16);
  return c.toDataURL();
}

function makeCard(i) {
  var sec = document.createElement('section');
  sec.className = 'note-item';
  sec.innerHTML =
    '<a class="cover" href="/explore/6adc8232000000002c01bba' + i + '"><img alt=""></a>' +
    '<a class="title" href="/explore/6adc8232000000002c01bba' + i + '"><span>' + NOTES[i % NOTES.length][0] + '</span></a>' +
    '<div class="author"><a href="/user/profile/6336ad420000000000000' + i + '"><img class="avatar" alt=""></a>' +
    '<span class="name">' + NOTES[i % NOTES.length][1] + '</span>' +
    '<span class="like-wrapper"><span class="count">' + NOTES[i % NOTES.length][2] + '</span></span></div>';
  return sec;
}

var feeds = document.getElementById('feeds');
for (var i = 0; i < 14; i++) {
  var sec = makeCard(i);
  feeds.appendChild(sec);
  sec.querySelector('.cover img').src = paint(360, 480, i, '#F4D9CE', '#C97B63');
  sec.querySelector('.avatar').src = paint(64, 64, i, '#DCE8E3', '#5F8F7C');
}

// 绝对定位瀑布流（复刻真实站点）
(function () {
  var COLS = 4, W = 240, GAP = 12, tops = [0, 0, 0, 0];
  feeds.style.position = 'relative';
  feeds.style.columnCount = 'auto';
  feeds.style.height = '2000px';
  Array.prototype.forEach.call(document.querySelectorAll('.note-item'), function (sec, i) {
    var c = i % COLS;
    sec.style.cssText = 'position:absolute;width:' + W + 'px;left:' + (c * (W + GAP)) + 'px;top:' + tops[c] + 'px;margin:0;';
    tops[c] += 300;
  });
})();

window.__fishyDemoOpen = function () {};
</script>

<script>window.__FISHY_DEMO__ = true;</script>
<script src="./xiaohongshu-fishy.user.js"></script>

<script>
var RESULT = [], PASS = 0, FAIL = 0;
function ok(name, cond, extra) {
  RESULT.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? '  [' + extra + ']' : ''));
  cond ? PASS++ : FAIL++;
  document.getElementById('fz-test').textContent = RESULT.join('\n');
}
function flush() {
  document.getElementById('fz-test').textContent = RESULT.join('\n') + '\n\n=== ' + PASS + ' pass / ' + FAIL + ' fail ===';
  document.title = 'TESTS ' + PASS + '/' + (PASS + FAIL);
}
function sleep(ms, cb) { setTimeout(cb, ms); }
function waitFor(fn, ms, cb) {
  var t0 = Date.now();
  (function loop() {
    var v = null;
    try { v = fn(); } catch (e) {}
    if (v) return cb(v);
    if (Date.now() - t0 > ms) return cb(null);
    setTimeout(loop, 40);
  })();
}

waitFor(function () { return document.querySelectorAll('.fz-row').length >= 10 ? 1 : 0; }, 4000, function () {
  var de = document.documentElement;

  ok('S1 表格已生成（≥10 行）', document.querySelectorAll('.fz-row').length >= 10,
     document.querySelectorAll('.fz-row').length + ' rows');

  ok('S2 页面比视口高，存在滚动条', de.scrollHeight > de.clientHeight + 60,
     de.scrollHeight + '/' + de.clientHeight);

  // 站点重渲染：把某一行的单元格冲掉
  var rows = document.querySelectorAll('.fz-row');
  var victim = rows[2];
  var vc = victim.querySelector('.fz-cells');
  if (vc) vc.remove();
  ok('S3 已模拟站点冲掉单元格', !victim.querySelector('.fz-cells'));

  sleep(600, function () {
    ok('S4 被冲掉的单元格自动重建', !!victim.querySelector('.fz-cells'),
       (victim.textContent || '').slice(0, 14));

    // 模拟滚动加载：追加 3 张卡片
    var before = document.querySelectorAll('.fz-row').length;
    for (var n = 20; n < 23; n++) {
      var sec = makeCard(n);
      document.querySelector('.fz-rows').appendChild(sec);
      sec.querySelector('.cover img').src = paint(360, 480, n, '#E3E1F0', '#6E68A8');
      sec.querySelector('.avatar').src = paint(64, 64, n, '#DCE8E3', '#5F8F7C');
    }
    sleep(1600, function () {
      var after = document.querySelectorAll('.fz-row').length;
      ok('S5 新增卡片自动变成表格行', after >= before + 3, before + '->' + after);

      var nums = Array.prototype.map.call(document.querySelectorAll('.fz-row .fz-num'), function (n) {
        return parseInt(n.textContent, 10);
      });
      var seq = nums.every(function (v, i) { return v === i + 1; });
      ok('S5b 行号连续不重复', seq, nums.slice(0, 8).join(',') + '…');

      // 反复滚动
      window.scrollTo(0, 400);
      sleep(120, function () {
        window.scrollTo(0, 900);
        sleep(120, function () {
          window.scrollTo(0, 0);
          sleep(400, function () {
            var rs = document.querySelectorAll('.fz-row');
            var empty = 0;
            Array.prototype.forEach.call(rs, function (r) {
              if ((r.textContent || '').replace(/\s/g, '').length < 3) empty++;
            });
            ok('S6 反复滚动后行数不减少', rs.length >= after, rs.length + ' rows');
            ok('S7 反复滚动后没有空行', empty === 0, empty + ' empty');

            // 搜索
            var si = document.querySelector('.fz-search');
            si.value = '不存在的关键词zzz';
            si.dispatchEvent(new Event('input', { bubbles: true }));
            var shown = Array.prototype.filter.call(rs, function (r) { return !r.classList.contains('fz-hide'); }).length;
            ok('S8 搜索无结果时行只是隐藏、不被删掉', shown === 0 && document.querySelectorAll('.fz-row').length === rs.length,
               shown + '/' + rs.length);
            si.value = '';
            si.dispatchEvent(new Event('input', { bubbles: true }));
            var shown2 = Array.prototype.filter.call(rs, function (r) { return !r.classList.contains('fz-hide'); }).length;
            ok('S9 清空搜索后全部恢复', shown2 === rs.length, shown2 + '/' + rs.length);

            // 退出登录/登录按钮存在
            var auth = document.querySelector('.fz-authslot [data-fz-auth]');
            ok('S10 登录/登出按钮存在', !!auth, auth ? auth.textContent : 'n/a');
            ok('S11 登出按钮文案为“登出”', !!auth && auth.textContent.indexOf('登出') > -1,
               auth ? auth.textContent : 'n/a');

            var sw = document.getElementById('site-search');
            ok('S12b 站点大搜索框已隐藏', !sw || sw.offsetParent === null ||
               getComputedStyle(sw.closest('.searchwrap') || sw).display === 'none');
            var ais = document.querySelectorAll('.airow .ai');
            var aiHidden = Array.prototype.every.call(ais, function (a) {
              return a.offsetParent === null || getComputedStyle(a.closest('.airow')).display === 'none';
            });
            ok('S12c AI 两个按钮已隐藏', aiHidden && ais.length === 2, ais.length + ' pills');
            var cats = document.querySelectorAll('.fz-cats .fz-cat');
            ok('S12d 分类已重画到工具栏', cats.length >= 5, cats.length + ' cats');

            var more = document.getElementById('fz-more');
            ok('S12 表格末尾有“加载更多”行', !!more && !!more.querySelector('.fz-link'),
               more ? more.textContent.slice(0, 12) : 'n/a');

            var scrolled = 0;
            window.addEventListener('scroll', function () { scrolled++; });
            var moreBtn = document.getElementById('fz-more-btn');
            if (moreBtn) moreBtn.click();
            sleep(400, function () {
              ok('S13 点加载更多会派发滚动事件', scrolled > 0, scrolled + ' events');

              var opened = null, origOpen = window.open;
              window.open = function (u) { opened = u; return null; };
              var out = document.querySelector('[data-fz-auth="out"]');
              if (out) out.click();
              sleep(150, function () {
                window.open = origOpen;
                // 现在的登出走"真退出"：先调登出接口，失败就切到原生界面让用户点退出
                var yielded = document.documentElement.classList.contains('fz-yield');
                ok('S14 点登出会切到原生界面执行真实退出', yielded,
                   'yield=' + yielded + ' intent=' + (window.__fzLogoutIntent || '-'));
                flush();
              });
            });
          });
        });
      });
    });
  });
});
</script>
</body>
</html>
