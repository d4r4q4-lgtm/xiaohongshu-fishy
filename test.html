<script>
var NOTES = [
  ['秋日通勤穿搭｜三件套就够了', '小鹿不迷路', '1.2万'],
  ['周末去了趟苏州，园林真的会呼吸', '阿栗', '8642'],
  ['厨房收纳改造，台面终于空了', '住在二楼', '3.4万'],
  ['一个人住的第三年，客厅长这样', 'Momo', '2.1万'],
  ['手冲咖啡入门：三支豆子横评', '豆子研究所', '6321'],
  ['把阳台改成小书房，花了 800 块', '木木', '1.8万'],
  ['抄作业｜新手化妆只需要这 6 件', 'Zoey', '5.6万'],
  ['这周读的三本书，第二本看哭了', '书桌旁', '3402'],
  ['上海 citywalk 路线，全程不踩雷', '走走停停', '9871'],
  ['租房改造｜&lt;b&gt;墙面&lt;/b&gt;这样处理最省钱', '小工头', '1.4万']
];
var PAL = [['#F4D9CE','#C97B63'],['#DCE8E3','#5F8F7C'],['#F2E7D5','#B4894F'],['#E3E1F0','#6E68A8'],['#F7DFE3','#C2708A'],['#E6EFF6','#5A8CB0']];

function paint(w, h, i, a, b) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var x = c.getContext('2d');
  var g = x.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, a); g.addColorStop(1, b);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = 'rgba(255,255,255,.7)';
  x.font = '600 ' + Math.round(w / 12) + 'px sans-serif';
  x.fillText('IMG ' + (i + 1), w * .08, h * .92);
  return c.toDataURL();
}

var feeds = document.getElementById('feeds');
for (var i = 0; i < NOTES.length; i++) {
  var n = NOTES[i];
  var sec = document.createElement('section');
  sec.className = 'note-item';
  sec.innerHTML =
    '<a class="cover" href="/explore/6adc8232000000002c01baa' + i + '"><img alt=""></a>' +
    '<a class="title" href="/explore/6adc8232000000002c01baa' + i + '"><span>' + n[0] + '</span></a>' +
    '<div class="author">' +
      '<a href="/user/profile/6336ad4200000000000000' + i + '"><img class="avatar" alt=""></a>' +
      '<span class="name">' + n[1] + '</span>' +
      '<span class="like-wrapper"><span class="count">' + n[2] + '</span></span>' +
    '</div>';
  feeds.appendChild(sec);
  var p = PAL[i % PAL.length];
  sec.querySelector('.cover img').src = paint(360, 480, i, p[0], p[1]);
  sec.querySelector('.avatar').src = paint(64, 64, i, p[1], p[0]);
}

// 复刻真实站点的绝对定位瀑布流
(function () {
  var COLS = 4, W = 240, GAP = 12, tops = [0, 0, 0, 0];
  feeds.style.position = 'relative';
  feeds.style.columnCount = 'auto';
  feeds.style.height = '2200px';
  document.querySelectorAll('.note-item').forEach(function (sec, i) {
    var c = i % COLS;
    sec.style.position = 'absolute';
    sec.style.width = W + 'px';
    sec.style.left = (c * (W + GAP)) + 'px';
    sec.style.top = tops[c] + 'px';
    sec.style.margin = '0';
    tops[c] += 300;
  });
})();

document.querySelectorAll('img[data-cmt-img]').forEach(function (im) {
  im.src = paint(200, 200, 99, '#E3E1F0', '#6E68A8');
});

window.__fishyDemoOpen = function (data) {
  document.getElementById('detail-title').textContent = data.title || '笔记';
  document.getElementById('detail-author').textContent = data.author || '';
  document.getElementById('detail-img').src = (data.urls && data.urls[0]) || '';
  document.getElementById('detail-desc').textContent = '这次把家里的角落都翻新了一遍，预算两千以内。';
  document.getElementById('detail').hidden = false;
};

// ---------- 断言框架 ----------
var RESULT = [], PASS = 0, FAIL = 0;
function ok(name, cond, extra) {
  var line = (cond ? 'PASS ' : 'FAIL ') + name + (extra ? '  [' + extra + ']' : '');
  RESULT.push(line);
  cond ? PASS++ : FAIL++;
  document.getElementById('fz-test').textContent = RESULT.join('\n');
}
function flush() {
  document.getElementById('fz-test').textContent =
    RESULT.join('\n') + '\n\n=== ' + PASS + ' pass / ' + FAIL + ' fail ===';
  document.title = 'TESTS ' + PASS + '/' + (PASS + FAIL);
}
function waitFor(fn, ms, cb) {
  var t0 = Date.now();
  (function loop() {
    var v = null;
    try { v = fn(); } catch (e) {}
    if (v) return cb(v);
    if (Date.now() - t0 > ms) return cb(null);
    setTimeout(loop, 50);
  })();
}
function sleep(ms, cb) { setTimeout(cb, ms); }
var ERRLOG = [];
(function () {
  var ce = console.error, cw = console.warn;
  console.error = function () {
    try { ERRLOG.push(Array.prototype.map.call(arguments, function (a) { return (a && a.message) || String(a); }).join(' ')); } catch (e) {}
    ce.apply(console, arguments);
  };
})();
window.addEventListener('error', function (ev) {
  try { ok('JS 报错：' + (ev.message || ''), false, (ev.filename || '').split('/').pop() + ':' + ev.lineno); } catch (e) {}
});
window.addEventListener('unhandledrejection', function (ev) {
  try { ok('JS 未捕获 Promise：' + (ev.reason && ev.reason.message || ''), false); } catch (e) {}
});
</script>

<script>
var VIEW_W = document.documentElement.clientWidth;

waitFor(function () { return document.querySelectorAll('.fz-row').length >= 8 ? 1 : 0; }, 4000, function () {
  var rows = Array.prototype.slice.call(document.querySelectorAll('.fz-row'));

  ok('T1 外壳已注入（3 块：标题/列号/底栏）', document.querySelectorAll('.fz-chrome').length === 3,
     'got ' + document.querySelectorAll('.fz-chrome').length);
  ok('T2 标题伪装成工作簿1', document.title === '工作簿1', document.title);
  ok('T3 一帖一行（≥8 行）', rows.length >= 8, rows.length + ' rows');

  var auth = document.querySelector('.fz-authslot [data-fz-auth]');
  ok('T23 标题栏有登录/登出按钮', !!auth, auth ? auth.textContent : 'n/a');
  ok('T24 按钮带真实动作标记', !!auth && /^(in|out)$/.test(auth.dataset.fzAuth || ''),
     auth ? auth.dataset.fzAuth : 'n/a');
  ok('T25 防闪遮罩已揭开', !document.documentElement.classList.contains('fz-boot'));

  var si = document.querySelector('.fz-search');
  ok('T26 标题栏有搜索框', !!si && si.tagName === 'INPUT', si ? si.tagName : 'n/a');
  if (si) {
    si.value = '苏州';
    si.dispatchEvent(new Event('input', { bubbles: true }));
    var vis = Array.prototype.filter.call(rows, function (r) { return !r.classList.contains('fz-hide'); });
    ok('T27 搜索能过滤行', vis.length === 1 && vis[0].textContent.indexOf('苏州') > -1, vis.length + ' visible');
    si.value = '';
    si.dispatchEvent(new Event('input', { bubbles: true }));
    var vis2 = Array.prototype.filter.call(rows, function (r) { return !r.classList.contains('fz-hide'); });
    ok('T28 清空后恢复全部', vis2.length === rows.length, vis2.length + '/' + rows.length);
  }

  var wide = rows.every(function (r) { return Math.abs(r.getBoundingClientRect().width - VIEW_W) < VIEW_W * 0.06; });
  ok('T4 每行铺满视口宽度', wide,
     rows.length ? Math.round(rows[0].getBoundingClientRect().width) + '/' + VIEW_W : 'n/a');

  var sorted = true;
  for (var i = 1; i < rows.length; i++) {
    if (rows[i].getBoundingClientRect().top < rows[i - 1].getBoundingClientRect().top - 1) sorted = false;
  }
  ok('T5 行自上而下顺序排列', sorted);

  var hiddenImgs = Array.prototype.every.call(document.querySelectorAll('.fz-row img'), function (im) {
    if (im.checkVisibility) return !im.checkVisibility({ opacityProperty: true, visibilityProperty: true });
    var layer = im.closest('.fz-row'); var op = 1;
    while (layer && layer !== im) { op *= parseFloat(getComputedStyle(layer).opacity); layer = layer.parentElement && layer.parentElement.closest('.fz-row > *'); }
    return op === 0;
  });
  ok('T6 行内原图全部不可见', hiddenImgs, document.querySelectorAll('.fz-row img').length + ' img hidden');

  var links = document.querySelectorAll('.fz-row .fz-link');
  ok('T7 图片转成文字链接', links.length >= rows.length, links.length + ' links');

  var esc2 = rows[rows.length - 1].querySelector('.fz-et');
  ok('T8 标题里的 HTML 被转义（不生成 <b>）',
     !!esc2 && esc2.querySelector('b') === null && esc2.textContent.indexOf('<b>') > -1,
     esc2 ? esc2.textContent.slice(0, 20) : 'n/a');

  ok('T9 底部空白网格行铺满', document.querySelectorAll('.fz-frow').length >= 5,
     document.querySelectorAll('.fz-frow').length + ' fillers');

  // ---- 点图片链接 ----
  var link = links[0];
  link.click();
  sleep(120, function () {
    var v = document.querySelector('.fz-viewer');
    ok('T10 点击图01 弹出悬浮窗', !!v);
    var vi = v && v.querySelector('.fz-v-bd img');
    ok('T11 悬浮窗里有图片且 src 有效', !!vi && /^(data:|https?:)/.test(vi.getAttribute('src') || ''),
       vi ? (vi.getAttribute('src') || '').slice(0, 24) : 'no img');
    ok('T12 悬浮窗在视口内', (function () {
      if (!v) return false;
      var r = v.getBoundingClientRect();
      return r.left >= -2 && r.top >= -2 && r.left < VIEW_W && r.width > 100 && r.height > 80;
    })(), v ? JSON.stringify(v.getBoundingClientRect()).slice(0, 60) : 'n/a');

    // 点别处关闭
    document.body.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    sleep(80, function () {
      ok('T13 点别处关闭悬浮窗', !document.querySelector('.fz-viewer'));

      // Boss key
      links[1].click();
      sleep(80, function () {
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'X', ctrlKey: true, shiftKey: true, bubbles: true }));
        sleep(80, function () {
          ok('T14 Ctrl+Shift+X 一键收起', !document.querySelector('.fz-viewer'));
          gotoDetail(links);
        });
      });
    });
  });
});

function gotoDetail(links) {
  // 复刻真实页面：详情数据在 __INITIAL_STATE__ 里，轮播只渲染第一张
  var IMGS = [];
  for (var q = 1; q <= 6; q++) {
    var pq = PAL[q % PAL.length];
    IMGS.push({ urlDefault: paint(720, 960, q, pq[0], pq[1]), width: 1080, height: 1440 });
  }
  window.__INITIAL_STATE__ = {
    note: {
      noteDetailMap: {
        '6adc8232000000002c01baa0': {
          note: {
            noteId: '6adc8232000000002c01baa0',
            imageList: IMGS,
            tagList: [{ name: '通勤' }, { name: '穿搭' }],
            interactInfo: { likedCount: '1180', collectedCount: '96', commentCount: '19' }
          }
        }
      }
    }
  };

  // 模拟：点击时写入缓存 → 跳到笔记页
  var first = document.querySelector('.fz-row');
  var t = first.querySelector('.fz-et').textContent;
  sessionStorage.setItem('fz-note', JSON.stringify({
    id: '6adc8232000000002c01baa0', title: t, author: '小鹿不迷路', likes: '1.2万',
    uid: '6336ad4200000000000000', urls: [document.querySelector('#feeds .cover img').src],
    dims: ['360×480'], type: '图文'
  }));
  document.getElementById('detail').hidden = false;
  document.getElementById('detail-title').textContent = t;
  document.getElementById('detail-author').textContent = '小鹿不迷路';
  document.getElementById('detail-img').src = document.querySelector('#feeds .cover img').src;
  history.pushState({}, '', '/explore/6adc8232000000002c01baa0');

  waitFor(function () { return document.querySelector('.fz-notesheet') ? 1 : 0; }, 3000, function () {
    var ns = document.querySelector('.fz-notesheet');
    ok('T15 笔记页接管成表格', !!ns);
    if (!ns) return flush();

    var nrows = ns.querySelectorAll('.fz-nrow');
    var cmtAll = document.querySelectorAll('[class*="comment-item"]');
    var cmtVis = Array.prototype.filter.call(cmtAll, function (e) {
      var r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0;
    }).length;
    var c0 = cmtAll[0], c0r = c0 ? c0.getBoundingClientRect() : null;
    ok('T16 主帖 1 行 + 评论 4 行（含 1 条回复）', nrows.length === 5,
       nrows.length + ' rows / cmt ' + cmtAll.length + '/' + cmtVis +
       (c0r ? ' ' + Math.round(c0r.width) + 'x' + Math.round(c0r.height) + ' ' + getComputedStyle(c0).display : '') +
       ' | detail display=' + getComputedStyle(document.getElementById('detail')).display +
       ' hidden=' + document.getElementById('detail').hasAttribute('hidden') +
       ' rect=' + Math.round(document.getElementById('detail').getBoundingClientRect().height) +
       ' | cList=' + Math.round((document.querySelector('.comment-list') || {getBoundingClientRect:function(){return {height:-1}}}).getBoundingClientRect().height) +
       ' | fzHide=' + (document.getElementById('detail').dataset.fzHide || '-') +
       ' inf=' + (document.getElementById('detail').style.cssText || '-'));

    var main = nrows[0];
    ok('T17 主帖标题取自缓存（正确）', main.textContent.indexOf('秋日通勤穿搭') > -1,
       main.querySelector('.fz-et') ? main.querySelector('.fz-et').textContent : 'n/a');

    var mainLinks = main.querySelectorAll('.fz-link[data-i]');
    ok('T30 主贴 6 张图全部列出（不再只给 2/4 张）', mainLinks.length === 6,
       mainLinks.length + ' links');
    var stat = ns.querySelector('#fz-ns-stat');
    ok('T31 信息条显示 图 6', !!stat && /图\s*6\b/.test(stat.textContent),
       stat ? stat.textContent.replace(/\s+/g, ' ').slice(0, 70) : 'n/a');

    var lvRow = null, pIdx = -1, cIdx = -2;
    Array.prototype.forEach.call(nrows, function (r, i2) {
      if (r.textContent.indexOf('这个我也买了') > -1) pIdx = i2;
      if (r.textContent.indexOf('谢谢支持') > -1) { lvRow = r; cIdx = i2; }
    });
    ok('T32 回复排在被回复评论的下一行', !!lvRow && cIdx === pIdx + 1, pIdx + '→' + cIdx);
    ok('T33 回复行带层级样式且缩进', !!lvRow && lvRow.classList.contains('fz-lv1') &&

       lvRow ? lvRow.className + ' pad=' + getComputedStyle(lvRow.querySelector('.fz-e')).paddingLeft : 'n/a');

    var cmtLikes = nrows[1] ? nrows[1].querySelectorAll('.fz-a span') : [];
    var likeTxt = cmtLikes[0] ? cmtLikes[0].textContent : '';
    ok('T18 评论赞数不出现"赞赞"', likeTxt.indexOf('赞赞') === -1, likeTxt);

    ok('T19 详情页不显示大图', ns.querySelectorAll('img').length === 0,
       ns.querySelectorAll('img').length + ' img');

    var dl = ns.querySelector('.fz-link');
    ok('T20 详情页有图01 链接', !!dl, dl ? dl.textContent : 'n/a');
    if (dl) {
      dl.click();
      sleep(120, function () {
        var v = document.querySelector('.fz-viewer');
        ok('T21 详情页点图01 能看原图', !!v && !!v.querySelector('.fz-v-bd img'));
        // 评论里的图必须点出自己的图，不能串成主贴的

          if (r.textContent.indexOf('求链接') > -1) cmtRow = r;
        });

        ok('T28b 评论行有图片链接', !!cmtLink,

           ' urls=' + (cmtRow && cmtRow.__fz ? (cmtRow.__fz.urls || []).length : 'nofz') +
           ' txt=' + (cmtRow ? (cmtRow.textContent || '').slice(0, 24) : ''));
        var cmtImgSrc = (document.querySelector('img[data-cmt-img]') || {}).src || '';
        if (cmtLink) {
          cmtLink.click();
          var vv = document.querySelector('.fz-viewer .fz-v-bd img');
          ok('T29 评论图片点开的是自己的图（不与主贴串号）',

             (vv ? (vv.getAttribute('src') || '').slice(0, 16) : 'no img') +
             ' | want ' + (cmtImgSrc || '').slice(0, 16));
          document.querySelector('.fz-viewer .fz-v-x').click();
        }

        // 关闭按钮已按用户要求删除，改用 Esc 关闭
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));

          ok('T22 Esc 可关闭笔记表', !document.querySelector('.fz-notesheet'));

      flush();

  });
}

// 第三段：接口返回是 snake_case（note_card / image_list / url_default），必须也认
function snakeCaseTest() {
  var P = window.__fzProbe;
  ok('T34 内部探针可用', !!P && typeof P.readStateNote === 'function', P ? 'ok' : 'no probe');
  if (!P) return flush();

  // 接口 /api/sns/web/v1/feed 的真实形态
  window.__INITIAL_STATE__ = {
    note: {
      note_detail_map: {
        'aaaabbbbccccddddeeeeffff': {
          note: {
            note_id: 'aaaabbbbccccddddeeeeffff',
            image_list: [
              { url_default: 'https://sns-webpic-qc.xhscdn.com/202610/s1.jpg', width: 1080, height: 1440 },
              { url_pre: 'https://sns-webpic-qc.xhscdn.com/202610/s2.jpg', width: 1080, height: 1440 }
            ],
            tag_list: [{ name: '测试' }, { name: '接口' }],
            interact_info: { liked_count: '7', comment_count: '2', collected_count: '1' }
          }
        }
      }
    }
  };
  var r1 = P.readStateNote('aaaabbbbccccddddeeeeffff');
  ok('T35 snake_case 状态（image_list/url_default）能取到图',
     !!r1 && r1.images.length === 2, r1 ? r1.images.length + ' imgs' : 'null');
  ok('T36 snake_case 互动数与话题', !!r1 && r1.likes === '7' && r1.tags.length === 2,
     r1 ? 'likes=' + r1.likes + ' tags=' + r1.tags.join(',') : 'null');

  // 只有 note_card 一层、没有外层 note 的形态
  window.__INITIAL_STATE__ = {
    items: [{
      id: 'cccc1111222233334444',
      note_card: {
        note_id: 'cccc1111222233334444',
        image_list: [{ info_list: [{ url: 'https://sns-img-qc.xhscdn.com/202610/n1.jpg' }] }],
        interact_info: { liked_count: '42' }
      }
    }]
  };
  var r2 = P.readStateNote('cccc1111222233334444');
  ok('T37 note_card + info_list 形态能取到图', !!r2 && r2.images.length === 1,
     r2 ? r2.images[0].src.slice(0, 40) : 'null');

  // ---- 真实站点暴露出来的取数问题 ----
  ok('T38 时间只取日期，丢掉 IP 属地',
     P.pickTime('编辑于 09-27 广东') === '09-27' && P.pickTime('10-16江苏') === '10-16' &&
     P.pickTime('昨天 21:13') === '昨天 21:13',
     [P.pickTime('编辑于 09-27 广东'), P.pickTime('10-16江苏'), P.pickTime('昨天 21:13')].join(' / '));

  ok('T39 互动数能提出来（1千+ / 3250 / 10+）',
     P.pickNum('3250') === '3250' && P.pickNum('1千+') === '1千+' && P.pickNum('10+') === '10+',
     [P.pickNum('3250'), P.pickNum('1千+'), P.pickNum('10+')].join(' / '));

  ok('T40 导航/登录文案不会被当成正文',
     P.badText('推荐 RED 穿搭 美食 彩妆 影视') && P.badText('登录后查看') === true &&
     P.badText('今天做了红烧肉，孩子吃了两碗饭') === false);

  // 楼中楼：state 里 subComments + targetComment 要生成层级
  window.__INITIAL_STATE__ = {
    note: { noteDetailMap: { 'dddd1111222233334444': {
      note: { noteId: 'dddd1111222233334444', imageList: [{ urlDefault: 'https://sns-webpic-qc.xhscdn.com/x.jpg' }], type: 'normal' },
      comments: { list: [
        { id: 'c1', content: '一级评论', likeCount: '12', createTime: 1791519703000,
          userInfo: { nickname: '甲', userId: 'u1' },
          subComments: [
            { id: 'c2', content: '回复甲的', likeCount: '3', createTime: 1791521213000,
              userInfo: { nickname: '乙', userId: 'u2' }, targetComment: { id: 'c1', userInfo: { nickname: '甲' } } },
            { id: 'c3', content: '回复乙的', likeCount: '1', createTime: 1791521213000,
              userInfo: { nickname: '丙', userId: 'u3' }, targetComment: { id: 'c2', userInfo: { nickname: '乙' } } }
          ] }
      ] }
    } } }
  };
  var cs = P.stateComments('dddd1111222233334444');
  ok('T41 state 评论能生成楼中楼层级',
     !!cs && cs.length === 3 && cs[1].depth === 1 && cs[2].depth === 2 &&
     cs[1].parentAuthor === '甲' && cs[2].parentAuthor === '乙',
     cs ? cs.map(function (c) { return c.author + ':' + c.depth + (c.parentAuthor ? '<' + c.parentAuthor : ''); }).join(' | ') : 'null');

  ok('T42 评论时间戳格式化成年月日时分',
     !!cs && /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(cs[0].time), cs ? cs[0].time : 'null');

  // ---- 折叠：默认只显示第一条回复，按钮是"展开 N 条回复" ----
  var foldHtml = P.cmtRowsHtml([
    { author: '甲', desc: '一级', depth: 0, rootKey: 0, cIdx: 0, subTotal: '6', subHasMore: true, kids: [{}, {}] },
    { author: '乙', desc: '回复1', depth: 1, rootKey: 0, parentAuthor: '甲', kids: [] },
    { author: '丙', desc: '回复2', depth: 1, rootKey: 0, parentAuthor: '乙', kids: [] }
  ], 1);
  var box = document.createElement('div');
  box.innerHTML = foldHtml;
  var toggle = box.querySelector('.fz-toggle');
  ok('T43 有回复时按钮是"展开 N 条回复"（N 用站点总数）',
     !!toggle && /^展开\s*6\s*条回复$/.test(toggle.textContent.trim()), toggle ? toggle.textContent.trim() : 'no toggle');
  ok('T44 展开按钮带着定位信息（idx / more）',
     !!toggle && toggle.dataset.idx === '0' && toggle.dataset.more === '1',
     toggle ? 'idx=' + toggle.dataset.idx + ' more=' + toggle.dataset.more : 'no toggle');

  function hasToggle(total, kids) {
    var h = P.cmtRowsHtml([
      { author: 'A', desc: '一级', depth: 0, rootKey: 0, cIdx: 0, subTotal: total,
        subHasMore: total > (kids || 0), kids: [] }
    ], 1);
    var b = document.createElement('div');
    b.innerHTML = h;
    return !!b.querySelector('.fz-toggle');
  }
  ok('T48 回复不足 2 条时不出现"展开"按钮',
     !hasToggle('0', 0) && !hasToggle('1', 1) && !hasToggle(0, 0),
     '0条:' + hasToggle('0', 0) + ' 1条:' + hasToggle('1', 1));
  ok('T49 回复 2 条及以上才出现"展开 N 条回复"',
     hasToggle('2', 1) && hasToggle('6', 1) && hasToggle('10+', 1),
     '2条:' + hasToggle('2', 1) + ' 10+:' + hasToggle('10+', 1));

  function hasToggle(total, kids) {
    var h = P.cmtRowsHtml([
      { author: 'A', desc: '一级', depth: 0, rootKey: 0, cIdx: 0, subTotal: total,
        subHasMore: total > (kids || 0), kids: [] }
    ], 1);
    var b = document.createElement('div');
    b.innerHTML = h;
    return !!b.querySelector('.fz-toggle');
  }
  ok('T48 回复不足 2 条时不出现"展开"按钮',
     !hasToggle('0', 0) && !hasToggle('1', 1) && !hasToggle(0, 0),
     '0条:' + hasToggle('0', 0) + ' 1条:' + hasToggle('1', 1));
  ok('T49 回复 2 条及以上才出现"展开 N 条回复"',
     hasToggle('2', 1) && hasToggle('6', 1) && hasToggle('10+', 1),
     '2条:' + hasToggle('2', 1) + ' 10+:' + hasToggle('10+', 1));

  // ---- 能找到站点自己的"展开 N 条回复"并点下去 ----
  var fake = document.createElement('div');
  fake.className = 'comment-item';
  fake.innerHTML = '<div class="info"><span class="more">展开 6 条回复</span></div>';
  document.body.appendChild(fake);
  var hit = 0;
  fake.querySelector('.more').addEventListener('click', function () { hit = 1; });
  var found = P.expandOnSite(9999);
  ok('T45 能定位并点击站点侧的"展开 N 条回复"', found === true && hit === 1,
     'found=' + found + ' clicked=' + hit);
  fake.remove();

  // ---- 接口拦截到的回复要能并进评论树（state 只给第一条时靠这个补全）----
  var namesBefore = (P.stateComments('dddd1111222233334444') || [])
    .map(function (c) { return c.author; }).join(',');
  P.absorbComments({ data: { comments: [
    { id: 'c9', content: '接口来的回复 A', like_count: '2', user_info: { nickname: '丁' }, target_comment: { id: 'c1' } },
    { id: 'c10', content: '接口来的回复 B', like_count: '1', user_info: { nickname: '戊' }, target_comment: { id: 'c1' } }
  ] } }, 0);
  var namesAfter = (P.stateComments('dddd1111222233334444') || [])
    .map(function (c) { return c.author; }).join(',');
  ok('T46 接口拦到的回复能补进评论树',
     namesBefore.indexOf('丁') === -1 && namesAfter.indexOf('丁') > -1 &&
     namesAfter.indexOf('戊') > -1,
     '入树后：' + namesAfter + '｜入树前：' + namesBefore);

  // 全量点击：页面上两个"展开N条回复"都要被点到
  var h1 = 0, h2 = 0;
  var f1 = document.createElement('div'); f1.className = 'comment-item'; f1.innerHTML = '<span class="m">展开 3 条回复</span>';
  var f2 = document.createElement('div'); f2.className = 'comment-item'; f2.innerHTML = '<span class="m">展开更多回复</span>';
  document.body.appendChild(f1); document.body.appendChild(f2);
  f1.querySelector('.m').addEventListener('click', function () { h1 = 1; });
  f2.querySelector('.m').addEventListener('click', function () { h2 = 1; });
  var cntHit = P.expandAllOnSite();
  ok('T47 全量点击能一次点到所有展开按钮', h1 === 1 && h2 === 1, '命中 ' + cntHit + ' 个，点击成 ' + h1 + '/' + h2);
  f1.remove(); f2.remove();

  flush();
}
</script>
</body>
</html>
